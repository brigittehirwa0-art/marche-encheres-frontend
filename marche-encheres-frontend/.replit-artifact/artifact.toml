kind = "web"
previewPath = "/"
title = "Marché aux enchères"
description = "Une marketplace française d'enchères modernes où les utilisateurs découvrent des objets, suivent les offres et vendent leurs propres articles."
version = "1.0.0"
id = "artifacts/marche-encheres"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20126

[services.development]
run = "pnpm --filter @workspace/marche-encheres run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/marche-encheres", "run", "build" ]
serve = "static"
publicDir = "artifacts/marche-encheres/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20126"
BASE_PATH = "/"
